<!doctype html><html lang="de-CH"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Handraise</title><style> *{box-sizing:border-box}body{font:18px system-ui;background:#eef4fa;color:#18334a;margin:0}main{max-width:680px;margin:32px auto;padding:24px;background:white;border-radius:24px;box-shadow:0 8px 32px #1232}h1{margin-top:0}button,input{font:inherit;padding:14px;border-radius:12px;border:1px solid #b6c7d5}button{background:#176b91;color:white;cursor:pointer;margin:8px 0}button:disabled{opacity:.5}input{width:100%}li{padding:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #ddd}ol{padding:0}#qr{display:flex;justify-content:center;margin:20px}#status{white-space:pre-wrap;color:#a33}.position{font-size:64px;font-weight:bold;color:#176b91;text-align:center} .secondary{background:white;color:#176b91} [hidden]{display:none!important}</style><main><h1>🙋 Handraise</h1><section id="teacher" hidden><button id="start">Unterrichtssitzung starten</button><div id="active" hidden><p>Scanne den QR-Code, wenn du Hilfe brauchst.</p><div id="qr"></div><h2 id="count"></h2><ol id="queue"></ol><button id="end" class="secondary">Sitzung beenden</button></div></section><section id="student" hidden><div id="join"><label for="name">Dein Vorname</label><input id="name" maxlength="50" autocomplete="off"><button id="help">🙋 Ich brauche Hilfe</button></div><div id="waiting" hidden><p>Dein Platz in der Warteschlange:</p><div id="position" class="position">…</div><p>Du kannst in der Zwischenzeit weiterarbeiten.</p><button id="cancel" class="secondary">Anfrage zurückziehen</button></div><p id="notice" role="status"></p></section><p id="status" role="alert"></p></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const base='https://fhmheoeqdnugapywqifv.supabase.co', key='sb_publishable_GJMSmPGChzjRI4m0AxqEHA_eHenOHjO';const $=id=>document.getElementById(id);const show=(id,v)=>$(id).hidden=!v;const sid=new URLSearchParams(location.search).get('s');let session=null, token=null,busy=false,refreshing=false;const storage=sid?'kh-student-'+sid:'kh-teacher';try{const saved=JSON.parse(sessionStorage.getItem(storage)||'null');if(sid)token=saved;else session=saved}catch{}function save(v){sessionStorage.setItem(storage,JSON.stringify(v))}async function rpc(name,args={}){const r=await fetch(base+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify(args)});if(!r.ok)throw Error('Datenbankfehler ('+r.status+'). Bitte erneut versuchen.');const t=await r.text();return t?JSON.parse(t):null}function teacherArgs(){return {p_session:session.session_id,p_teacher_token:session.teacher_token}}function studentArgs(){return {p_session:sid,p_student_token:token}}function teacherView(){show('start',!session);show('active',!!session);$('qr').replaceChildren();if(session){const url=new URL(location.href);url.search='';url.hash='';url.searchParams.set('s',session.session_id);if(location.protocol==='file:')$('qr').textContent='QR-Code funktioniert erst nach Online-Veröffentlichung.';else if(typeof QRCode==='function')new QRCode($('qr'),{text:url.href,width:220,height:220});else $('qr').textContent='QR-Code konnte nicht geladen werden.'}}function studentView(){show('join',!token);show('waiting',!!token)}async function refresh(){if(busy||refreshing)return;refreshing=true;try{if(sid&&token){const current=token;const p=await rpc('get_position',studentArgs());if(token!==current||busy)return;if(p===null){token=null;save(null);studentView();$('notice').textContent='Deine Anfrage ist nicht mehr in der Warteschlange.'}else $('position').textContent=p}else if(!sid&&session){const current=session;const q=await rpc('get_queue',teacherArgs());if(session!==current||busy)return;$('count').textContent=q.length+' '+(q.length===1?'Kind wartet':'Kinder warten');$('queue').replaceChildren();q.forEach((r,i)=>{const li=document.createElement('li'),label=document.createElement('span'),b=document.createElement('button');label.textContent=(i+1)+'. '+r.student_name;b.textContent='✓ Erledigt';b.onclick=()=>act(()=>rpc('complete_request',{...teacherArgs(),p_request_id:r.request_id}));li.append(label,b);$('queue').append(li)})}$('status').textContent=''}catch(e){$('status').textContent=e.message}finally{refreshing=false}}async function act(fn){if(busy)return;busy=true;try{await fn();$('status').textContent=''}catch(e){$('status').textContent=e.message;return}finally{busy=false}await refresh()}$('start').onclick=()=>act(async()=>{session=await rpc('start_session');save(session);teacherView()});$('end').onclick=()=>{if(confirm('Sitzung beenden und alle Anfragen löschen?'))act(async()=>{await rpc('end_session',teacherArgs());session=null;save(null);teacherView();$('queue').replaceChildren()})};$('help').onclick=()=>{const name=$('name').value.trim();if(!name){$('notice').textContent='Bitte gib deinen Vornamen ein.';return}act(async()=>{token=await rpc('request_help',{p_session:sid,p_name:name});save(token);$('notice').textContent='';$('position').textContent='…';studentView()})};$('cancel').onclick=()=>act(async()=>{await rpc('cancel_request',studentArgs());token=null;save(null);studentView();$('notice').textContent='Deine Anfrage wurde zurückgezogen.'});show('teacher',!sid);show('student',!!sid);if(sid)studentView();else teacherView();refresh();setInterval(refresh,3000);
</script></html>
