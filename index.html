const base='https://fhmheoeqdnugapywqifv.supabase.co', key='sb_publishable_GJMSmPGChzjRI4m0AxqEHA_eHenOHjO';const $=id=>document.getElementById(id);const show=(id,v)=>$(id).hidden=!v;const sid=new URLSearchParams(location.search).get('s');let session=null, token=null,busy=false,refreshing=false,auth=null;const storage=sid?'kh-student-'+sid:'kh-teacher';try{const saved=JSON.parse(sessionStorage.getItem(storage)||'null');if(sid)token=saved;else session=saved}catch{}function save(v){sessionStorage.setItem(storage,JSON.stringify(v))}async function rpc(name,args={}){const r=await fetch(base+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:key,'Content-Type':'application/json',...(name==='start_session'?{Authorization:'Bearer '+await accessToken()}: {})},body:JSON.stringify(args)});if(!r.ok)throw Error('Datenbankfehler ('+r.status+'). Bitte erneut versuchen.');const t=await r.text();return t?JSON.parse(t):null}function teacherArgs(){return {p_session:session.session_id,p_teacher_token:session.teacher_token}}function studentArgs(){return {p_session:sid,p_student_token:token}}function teacherView(){show('start',!session);show('active',!!session);$('qr').replaceChildren();if(session){const url=new URL(location.href);url.search='';url.hash='';url.searchParams.set('s',session.session_id);if(location.protocol==='file:')$('qr').textContent='QR-Code funktioniert erst nach Online-Veröffentlichung.';else if(typeof QRCode==='function')new QRCode($('qr'),{text:url.href,width:220,height:220});else $('qr').textContent='QR-Code konnte nicht geladen werden.'}}function studentView(){show('join',!token);show('waiting',!!token)}async function refresh(){if(busy||refreshing)return;refreshing=true;try{if(sid&&token){const current=token;const p=await rpc('get_position',studentArgs());if(token!==current||busy)return;if(p===null){token=null;save(null);studentView();$('notice').textContent='Deine Anfrage ist nicht mehr in der Warteschlange.'}else $('position').textContent=p}else if(!sid&&session&&auth){const current=session;const q=await rpc('get_queue',teacherArgs());if(session!==current||busy)return;$('count').textContent=q.length+' '+(q.length===1?'Kind wartet':'Kinder warten');$('queue').replaceChildren();q.forEach((r,i)=>{const li=document.createElement('li'),label=document.createElement('span'),b=document.createElement('button');label.textContent=(i+1)+'. '+r.student_name;b.textContent='✓ Erledigt';b.onclick=()=>act(()=>rpc('complete_request',{...teacherArgs(),p_request_id:r.request_id}));li.append(label,b);$('queue').append(li)})}$('status').textContent=''}catch(e){$('status').textContent=e.message}finally{refreshing=false}}async function act(fn){if(busy)return;busy=true;try{await fn();$('status').textContent=''}catch(e){$('status').textContent=e.message;return}finally{busy=false}await refresh()}$('start').onclick=()=>act(async()=>{session=await rpc('start_session');save(session);teacherView()});$('end').onclick=()=>{if(confirm('Sitzung beenden und alle Anfragen löschen?'))act(async()=>{await rpc('end_session',teacherArgs());session=null;save(null);teacherView();$('queue').replaceChildren()})};$('help').onclick=()=>{const name=$('name').value.trim();if(!name){$('notice').textContent='Bitte gib deinen Vornamen ein.';return}act(async()=>{token=await rpc('request_help',{p_session:sid,p_name:name});save(token);$('notice').textContent='';$('position').textContent='…';studentView()})};$('cancel').onclick=()=>act(async()=>{await rpc('cancel_request',studentArgs());token=null;save(null);studentView();$('notice').textContent='Deine Anfrage wurde zurückgezogen.'});async function authRequest(grant,data){const r=await fetch(base+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error('Anmeldung fehlgeschlagen. Bitte Angaben prüfen oder erneut anmelden.');return await r.json()}
